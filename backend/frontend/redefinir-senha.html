<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir senha - MOVIEHUSTLER</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../src/style.css" />
</head>
<body>
  <!-- Reaproveita as mesmas classes do modal de conta (index.html), só que
       já "aberto" desde o carregamento — essa página não é um modal dentro
       de uma SPA, é o destino direto do link mandado por email (ver
       app/email.py), então não existe nada por trás pra revelar. -->
  <div class="modal-fundo gate-fundo aberto">
    <div class="modal-caixa conta-caixa gate-caixa">
      <div class="conta-marca">
        <span class="conta-marca-watch">MOVIE</span><span class="conta-marca-ust">HUSTLER</span>
      </div>

      <!-- Fora do <form> de propósito: precisa continuar visível mesmo
           depois que o formulário é escondido (form.hidden = true) pra
           mostrar a mensagem final de sucesso/erro — ver redefinir-senha.js. -->
      <p class="conta-subtitulo" id="redefinir-instrucao">Escolha sua senha nova.</p>

      <form class="form-conta" id="form-redefinir">
        <div class="campo-conta">
          <label for="redefinir-senha">Senha nova</label>
          <input type="password" id="redefinir-senha" placeholder="mínimo 6 caracteres" required minlength="6" />
        </div>

        <div class="campo-conta">
          <label for="redefinir-confirmar">Confirmar senha</label>
          <input type="password" id="redefinir-confirmar" placeholder="repita a senha" required minlength="6" />
        </div>

        <button type="submit" class="botao-conta-enviar" id="redefinir-botao">Redefinir senha</button>
        <p class="mensagem-conta" id="redefinir-mensagem" hidden></p>
      </form>

      <a href="/" class="link-esqueci-senha" id="redefinir-voltar" hidden>Ir para o login</a>
    </div>
  </div>

  <script type="module" src="../src/redefinir-senha.js"></script>
</body>
</html>
